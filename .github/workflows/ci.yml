name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # MetaTrader5 ships Windows wheels only; the tests don't need it.
      - run: grep -v '^MetaTrader5' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
      - run: python -m pytest -q
