name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - name: Test
        env:
          TELEGRAM_TOKEN: x
          SIGNAL_CHAT_ID: '1'
        run: python -m pytest -q
      - name: Build
        env:
          ZENO_PUBLIC_KEY: ${{ secrets.ZENO_LICENSE_PUBLIC_KEY }}
          ZENO_SERVER: ${{ vars.ZENO_LICENSE_SERVER }}
        run: python release/build_release.py --public-key "$env:ZENO_PUBLIC_KEY" --server "$env:ZENO_SERVER" --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ZenoCopier
          path: dist/ZenoCopier-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenoCopier-*.zip
